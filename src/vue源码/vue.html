        let res = fun.apply(obj, args)

    function deepClone(obj) {
        //判断是数组还是对象
        let obj2 = obj.constructor === Array ? [] : {}
        //判断是引用类型还是值类型
        if (typeof obj !== "object") {
            return obj
        }
        for (let key in obj) {
            if (typeof obj[key] !== "object") {
                obj2[key] = obj[key]
            } else {
                if (obj[key].constructor === Function) {
                    obj2[key] = obj[key].bind(obj2)
                } else {

                    obj2[key] = deepClone(obj[key])
                }

            }
        }

        return obj2
    }
